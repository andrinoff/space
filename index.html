<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive 3D WebGL Galaxy</title>
    <style>
        /* Basic reset and styling for the page */
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000000; /* Pitch black for deep space */
            font-family: 'Inter', sans-serif;
            color: white;
        }

        /* The canvas will fill the entire screen */
        canvas {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
        }

        /* A small info box to guide the user */
        #info-box {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 24px;
            background-color: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            text-align: center;
            font-size: 14px;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            pointer-events: none; /* Make it non-interactive */
        }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400&display=swap" rel="stylesheet">
</head>
<body>
    <canvas id="glCanvas"></canvas>
    <div id="info-box">Click and Drag to Rotate | Hold Click for Warp Speed</div>

    <!-- Import three.js library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script id="vertex-shader" type="x-shader/x-vertex">
        // This shader runs for every single particle (vertex)
        // It calculates the final 3D position of the particle on the screen.

        uniform float u_time;
        uniform float u_size;
        uniform float u_warp; // Controls the warp speed effect (0 to 1)
        
        // Data passed from JS for each vertex
        attribute float a_size;
        attribute vec3 a_customColor;
        attribute float a_spin;

        // Data passed to the fragment shader
        varying vec3 v_color;

        void main() {
            v_color = a_customColor;

            // --- Particle Position Logic ---
            // Start with the initial position
            vec3 pos = position;

            // Create a spiral galaxy arm effect
            float angle = atan(pos.x, pos.z);
            float dist = length(pos.xz);
            float offset = -dist * 0.2;
            angle += offset + u_time * 0.1 + a_spin;

            // Convert back from polar coordinates to cartesian
            pos.x = cos(angle) * dist;
            pos.z = sin(angle) * dist;

            // --- Warp Effect ---
            // When u_warp > 0, particles streak towards/away from the center
            float warpFactor = pow(u_warp, 3.0); // pow makes the effect more dramatic
            pos.y += warpFactor * 10.0 * (position.y - 0.5); // Spread them out vertically
            pos.xz *= (1.0 - warpFactor * 0.9); // Pull them towards the center

            // Project the 3D position to the 2D screen
            vec4 modelViewPosition = modelViewMatrix * vec4(pos, 1.0);
            gl_Position = projectionMatrix * modelViewPosition;

            // --- Particle Size ---
            // Size is based on distance from camera and warp effect
            float size = a_size * u_size;
            size -= modelViewPosition.z * 0.1; // Make distant particles smaller
            size += warpFactor * 80.0; // Make particles bigger during warp
            gl_PointSize = max(1.0, size);
        }
    </script>

    <script id="fragment-shader" type="x-shader/x-fragment">
        // This shader runs for every pixel inside a particle.
        // Its job is to determine the final color of the pixel.
        precision mediump float;

        varying vec3 v_color;

        void main() {
            // Create a soft, glowing circle for each particle
            float dist = length(gl_PointCoord - vec2(0.5));
            float alpha = 1.0 - smoothstep(0.4, 0.5, dist);

            // Set the final color (passed from vertex shader) with the calculated alpha
            gl_FragColor = vec4(v_color, alpha);
        }
    </script>


    <script>
        window.onload = function() {
            // --- 1. SCENE SETUP (using three.js) ---
            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 5;

            const canvas = document.getElementById('glCanvas');
            const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));


            // --- 2. GALAXY PARTICLES SETUP ---
            const NUM_PARTICLES = 100000;
            const geometry = new THREE.BufferGeometry();
            
            const positions = new Float32Array(NUM_PARTICLES * 3);
            const colors = new Float32Array(NUM_PARTICLES * 3);
            const sizes = new Float32Array(NUM_PARTICLES);
            const spins = new Float32Array(NUM_PARTICLES); // How fast each particle spins in its arm

            const colorInside = new THREE.Color("#ff6a00"); // Hot orange/yellow core
            const colorOutside = new THREE.Color("#1e90ff"); // Cool blue/purple arms

            for (let i = 0; i < NUM_PARTICLES; i++) {
                const i3 = i * 3;
                
                // Position particles in a disk shape
                const radius = Math.random() * 5;
                const spinAngle = radius * 3.0; // More spin further out
                const branchAngle = (i % 5) / 5 * Math.PI * 2; // 5 spiral arms
                
                const randomX = Math.pow(Math.random(), 2.0) * (Math.random() < 0.5 ? 1 : -1) * 0.2;
                const randomY = Math.pow(Math.random(), 2.0) * (Math.random() < 0.5 ? 1 : -1) * 0.2;
                const randomZ = Math.pow(Math.random(), 2.0) * (Math.random() < 0.5 ? 1 : -1) * 0.2;

                positions[i3    ] = Math.cos(branchAngle + spinAngle) * radius + randomX;
                positions[i3 + 1] = randomY; // Start flat on the Y plane
                positions[i3 + 2] = Math.sin(branchAngle + spinAngle) * radius + randomZ;

                // Color based on distance from center
                const mixedColor = colorInside.clone();
                mixedColor.lerp(colorOutside, radius / 5);
                colors[i3    ] = mixedColor.r;
                colors[i3 + 1] = mixedColor.g;
                colors[i3 + 2] = mixedColor.b;

                // Size
                sizes[i] = Math.random() * 1.5 + 0.5;

                // Spin speed
                spins[i] = (Math.random() - 0.5) * 0.5;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('a_customColor', new THREE.BufferAttribute(colors, 3));
            geometry.setAttribute('a_size', new THREE.BufferAttribute(sizes, 1));
            geometry.setAttribute('a_spin', new THREE.BufferAttribute(spins, 1));

            // --- 3. SHADER MATERIAL ---
            const material = new THREE.ShaderMaterial({
                uniforms: {
                    u_time: { value: 0 },
                    u_size: { value: 15.0 * renderer.getPixelRatio() },
                    u_warp: { value: 0.0 }
                },
                vertexShader: document.getElementById('vertex-shader').text,
                fragmentShader: document.getElementById('fragment-shader').text,
                blending: THREE.AdditiveBlending,
                depthWrite: false, // Important for blending
                transparent: true,
            });

            const particles = new THREE.Points(geometry, material);
            scene.add(particles);

            // --- 4. MOUSE INTERACTION & RESIZING ---
            let isMouseDown = false;
            let lastMouseX = 0;
            let lastMouseY = 0;
            let targetRotationX = 0;
            let targetRotationY = 0;
            
            // Listen for mouse down to start rotation and warp
            canvas.addEventListener('mousedown', (e) => {
                isMouseDown = true;
                lastMouseX = e.clientX;
                lastMouseY = e.clientY;
            });
            
            // Listen for mouse move to rotate the galaxy
            canvas.addEventListener('mousemove', (e) => {
                if (!isMouseDown) return;
                const deltaX = e.clientX - lastMouseX;
                const deltaY = e.clientY - lastMouseY;
                
                targetRotationY += deltaX * 0.005;
                targetRotationX += deltaY * 0.005;

                lastMouseX = e.clientX;
                lastMouseY = e.clientY;
            });

            // Listen for mouse up to stop rotation and warp
            canvas.addEventListener('mouseup', () => {
                isMouseDown = false;
            });

            // Handle window resizing
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
                renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                material.uniforms.u_size.value = 15.0 * renderer.getPixelRatio();
            });

            // --- 5. RENDER LOOP ---
            const clock = new THREE.Clock();
            
            function animate() {
                const elapsedTime = clock.getElapsedTime();
                
                // Update shader uniforms
                material.uniforms.u_time.value = elapsedTime;
                
                // Lerp warp value for smooth transitions
                const warpTarget = isMouseDown ? 1.0 : 0.0;
                material.uniforms.u_warp.value += (warpTarget - material.uniforms.u_warp.value) * 0.05;

                // Lerp rotation for smooth spinning
                particles.rotation.y += (targetRotationY - particles.rotation.y) * 0.1;
                particles.rotation.x += (targetRotationX - particles.rotation.x) * 0.1;

                // If not dragging, apply a slow, constant rotation
                if (!isMouseDown) {
                    targetRotationY *= 0.98; // Dampen the spin
                    targetRotationX *= 0.98;
                    particles.rotation.y += 0.0005;
                }
                
                // Render the scene
                renderer.render(scene, camera);

                // Request the next frame
                requestAnimationFrame(animate);
            }

            // Start the animation!
            animate();
        };
    </script>
</body>
</html>
